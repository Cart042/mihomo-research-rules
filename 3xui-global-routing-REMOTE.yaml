# Remote provider configuration for the public Cart042/mihomo-research-rules repository.
# This is the entire content for the 3x-ui Clash/Mihomo global routing field.

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
    proxy: DIRECT

  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400
    proxy: DIRECT

  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400
    proxy: DIRECT

  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400
    proxy: DIRECT

  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
    proxy: DIRECT

  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
    proxy: DIRECT

  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
    proxy: DIRECT

  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400
    proxy: DIRECT

  tld-not-cn:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt"
    path: ./ruleset/tld-not-cn.yaml
    interval: 86400
    proxy: DIRECT

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
    proxy: DIRECT

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
    proxy: DIRECT

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
    proxy: DIRECT

  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
    proxy: DIRECT

  Research:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/Cart042/mihomo-research-rules/main/rules/Research.yaml"
    path: ./ruleset/Research.yaml
    interval: 86400
    proxy: DIRECT

# OPTIONAL: broad institution-wide direct routing; uncomment and add a RULE-SET entry if needed.
#  Research-Institutions:
#    type: http
#    behavior: classical
#    format: yaml
#    url: "https://raw.githubusercontent.com/Cart042/mihomo-research-rules/main/rules/Research-Institutions-Optional.yaml"
#    path: ./ruleset/Research-Institutions.yaml
#    interval: 86400
#    proxy: DIRECT

rules:
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  # Research-adjacent platforms intentionally excluded from DIRECT
  - DOMAIN-SUFFIX,google.com,PROXY
  - DOMAIN-SUFFIX,googleusercontent.com,PROXY
  - DOMAIN-SUFFIX,github.com,PROXY
  - DOMAIN-SUFFIX,github.io,PROXY
  - DOMAIN-SUFFIX,githubusercontent.com,PROXY
  - DOMAIN-SUFFIX,githubassets.com,PROXY
  - DOMAIN-SUFFIX,researchgate.net,PROXY
  - DOMAIN-SUFFIX,academia.edu,PROXY
  - DOMAIN-SUFFIX,semanticscholar.org,PROXY
  - DOMAIN-SUFFIX,connectedpapers.com,PROXY
  - DOMAIN-SUFFIX,litmaps.com,PROXY
  - DOMAIN-SUFFIX,dimensions.ai,PROXY
  - DOMAIN-SUFFIX,scite.org,PROXY
  - DOMAIN-SUFFIX,scite.ai,PROXY
  - DOMAIN-SUFFIX,openreview.net,PROXY
  - DOMAIN-SUFFIX,kaggle.com,PROXY

  # Academic sites before generic Google/proxy rules
  - RULE-SET,Research,DIRECT
  # - RULE-SET,Research-Institutions,DIRECT  # optional
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,PROXY
  - RULE-SET,proxy,PROXY
  - RULE-SET,direct,DIRECT
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - RULE-SET,telegramcidr,PROXY
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY